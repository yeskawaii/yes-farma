server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Service Worker: nunca cachearlo agresivamente.
    # Debe revalidarse para detectar nuevas versiones de la aplicación.
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # Script de registro de la PWA: nombre estable, debe revalidarse.
    location = /registerSW.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # HTML principal: siempre comprobar si existe una versión nueva.
    location = /index.html {
        expires off;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Manifest PWA.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires off;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Assets versionados por hash: estos sí pueden cachearse mucho tiempo.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Otros recursos estáticos.
    location ~* \.(?:ico|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        add_header Cache-Control "public" always;
        access_log off;
    }
}
