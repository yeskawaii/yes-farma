services:
  db:
    image: postgres:15-alpine
    container_name: yes-farma-db
    restart: unless-stopped
    env_file:
      - ./backend/.env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  backend:
    container_name: yes-farma-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      WHATSAPP_AUTH_DIR: /app/data/whatsapp-auth
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - whatsapp_auth_data:/app/data/whatsapp-auth
    networks:
      - app-network

  frontend:
    container_name: yes-farma-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  pgdata:
  whatsapp_auth_data:

networks:
  app-network:
